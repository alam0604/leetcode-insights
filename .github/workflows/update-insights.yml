name: Update LeetCode insights

on:
  schedule:
    - cron: "30 0 * * *" # every day, 06:00 IST
  workflow_dispatch: # "Run workflow" button for manual updates

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh charts and README
        env:
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
        run: python scripts/update_insights.py

      - name: Commit if the numbers changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg README.md
          if git diff --staged --quiet; then
            echo "No change in stats."
          else
            git commit -m "Update LeetCode insights"
            git push
          fi
